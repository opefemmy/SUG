name: CI and production deployment

on:
  pull_request:
    branches: [develop, prod]
  push:
    branches: [develop, prod]

concurrency:
  group: sug-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on PHP 8.1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sug-portal
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: bcmath, dom, fileinfo, gd, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sug-portal/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations and tests
        run: |
          php artisan migrate:fresh --force
          php artisan test

  deploy:
    name: Deploy prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: sug-portal
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: bcmath, dom, fileinfo, gd, mbstring, pdo_mysql, xml, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sug-portal/package-lock.json

      - name: Build production release
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          npm ci
          npm run build
          tar -czf "$RUNNER_TEMP/sug-portal-${GITHUB_SHA}.tar.gz" \
            --exclude=.env \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=database/database.sqlite \
            --exclude=storage \
            --exclude=bootstrap/cache/\* \
            .

      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/sug_deploy"
          chmod 600 "$HOME/.ssh/sug_deploy"
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh -i "$HOME/.ssh/sug_deploy" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_ROOT/incoming' '$DEPLOY_ROOT/releases' '$DEPLOY_ROOT/shared/storage'"
          scp -i "$HOME/.ssh/sug_deploy" -P "$port" \
            "$RUNNER_TEMP/sug-portal-${GITHUB_SHA}.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/incoming/${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh -i "$HOME/.ssh/sug_deploy" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_ROOT/releases/$GITHUB_SHA' && tar -xzf '$DEPLOY_ROOT/incoming/$GITHUB_SHA.tar.gz' -C '$DEPLOY_ROOT/releases/$GITHUB_SHA' && bash '$DEPLOY_ROOT/releases/$GITHUB_SHA/deploy/deploy-release.sh' '$DEPLOY_ROOT' '$GITHUB_SHA'"

      - name: Verify production
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 https://sug.ekscotech.edu.ng/up
